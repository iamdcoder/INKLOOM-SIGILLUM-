name: Sigillum CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TESSERACT_CMD: /usr/bin/tesseract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install system OCR dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng
      - name: Verify Tesseract and English language data
        run: |
          test -x "$TESSERACT_CMD"
          "$TESSERACT_CMD" --version
          languages="$("$TESSERACT_CMD" --list-langs 2>/dev/null)"
          printf '%s\n' "$languages"
          printf '%s\n' "$languages" | grep -qx "eng"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q backend apps tests scripts
      - name: Run backend tests
        run: pytest
      - name: Run synthetic golden evaluation
        run: python scripts/evaluate_golden_cases.py

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: sigillum_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-root-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sigillum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://sigillum_app:sigillum-app-ci-password@127.0.0.1:5432/sigillum_test
      STORAGE_BACKEND: local
      STORAGE_ROOT: ./data/private_uploads
      JWT_SECRET_KEY: ci-only-not-a-deployment-secret-000000000000
      SIGILLUM_DEMO_PASSWORD: CI-Only-Local-Password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install system OCR dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng
      - name: Create non-superuser application database role
        env:
          PGPASSWORD: postgres-ci-root-password
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE sigillum_app LOGIN PASSWORD 'sigillum-app-ci-password' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE sigillum_test OWNER TO sigillum_app;
          GRANT ALL ON SCHEMA public TO sigillum_app;
          SQL
          psql -h 127.0.0.1 -U postgres -d sigillum_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Upgrade empty PostgreSQL database to Alembic head
        run: python -m alembic upgrade head
      - name: Verify PostgreSQL schema and pgvector
        run: python scripts/verify_database.py
      - name: Compile Python sources
        run: python -m compileall -q backend apps tests scripts
      - name: Run backend suite against PostgreSQL
        run: pytest
      - name: Run synthetic golden evaluation
        run: python scripts/evaluate_golden_cases.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install
      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint
      - name: Type-check frontend
        working-directory: apps/web
        run: npm run typecheck
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
