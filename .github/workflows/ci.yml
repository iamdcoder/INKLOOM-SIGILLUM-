name: Sigillum CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TESSERACT_CMD: /usr/bin/tesseract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install system OCR dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng
      - name: Verify Tesseract and English language data
        run: |
          test -x "$TESSERACT_CMD"
          "$TESSERACT_CMD" --version
          languages="$("$TESSERACT_CMD" --list-langs 2>/dev/null)"
          printf '%s\n' "$languages"
          printf '%s\n' "$languages" | grep -qx "eng"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q backend apps tests scripts
      - name: Run backend tests
        run: pytest
      - name: Run synthetic golden evaluation
        run: python scripts/evaluate_golden_cases.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install
      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint
      - name: Type-check frontend
        working-directory: apps/web
        run: npm run typecheck
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
