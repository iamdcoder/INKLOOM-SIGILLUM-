# Development-only backing services. Do not expose these ports publicly.
services:
  db:
    profiles: ["infra"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sigillum
      POSTGRES_USER: sigillum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigillum -d sigillum"]
      interval: 5s
      timeout: 3s
      retries: 20
  clamav:
    profiles: ["security"]
    image: clamav/clamav:stable
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav_data:/var/lib/clamav"]
    restart: unless-stopped
  minio:
    profiles: ["infra"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sigillum}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-change-me}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  minio_data:
  clamav_data:
