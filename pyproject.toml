[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkloom-sigillum"
version = "0.1.0"
description = "Evidence-first, human-governed brand assurance platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.14.1",
  "sqlalchemy==2.0.50",
  "alembic==1.18.4",
  "python-multipart==0.0.29",
  "pypdf==5.9.0",
  "python-docx==1.2.0",
  "Pillow==12.3.0",
  "pytesseract==0.3.13",
  "PyJWT==2.13.0",
  "psycopg[binary]==3.2.12",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.14.10", "mypy==1.19.1"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
